<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../assets/js/config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts &amp; Notifications — WeatherIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'slate-900': '#0f172a',
            'slate-800': '#1e293b'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    @media (max-width: 1024px) {
      #sidebar { left: -256px; }
      #sidebar.open { left: 0; }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-dot { animation: pulse-dot 2s infinite; }
    .skeleton {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 0.5rem;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0.75rem; border-radius: 0.5rem; color: #94a3b8; transition: all 0.2s; }
    .sidebar-link:hover { color: #34d399; background: rgba(16,185,129,0.1); }
    .sidebar-link.active { color: #34d399; background: rgba(16,185,129,0.15); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-slate-800 flex flex-col z-40 transition-all duration-300">
    <div class="p-6 border-b border-slate-700">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🌤️</span>
        <span class="text-white font-bold text-xl">WeatherIQ</span>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="overview.html" class="sidebar-link"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Overview</a>
      <a href="history.html" class="sidebar-link"><i data-lucide="bar-chart-2" class="w-5 h-5"></i> Historical Data</a>
      <a href="analytics.html" class="sidebar-link"><i data-lucide="trending-up" class="w-5 h-5"></i> Weather Analytics</a>
      <a href="alerts.html" class="sidebar-link active"><i data-lucide="bell" class="w-5 h-5"></i> Alerts</a>
      <a href="devices.html" class="sidebar-link"><i data-lucide="cpu" class="w-5 h-5"></i> Device Management</a>
      <a href="reports.html" class="sidebar-link"><i data-lucide="file-text" class="w-5 h-5"></i> Reports</a>
      <a href="settings.html" class="sidebar-link"><i data-lucide="settings" class="w-5 h-5"></i> Settings</a>
    </nav>
    <div class="p-4 border-t border-slate-700">
      <button onclick="logout()" class="flex items-center gap-3 w-full px-3 py-2 text-slate-400 hover:text-red-400 rounded-lg transition-all">
        <i data-lucide="log-out" class="w-5 h-5"></i> Logout
      </button>
    </div>
  </aside>

  <main class="ml-64 min-h-screen bg-slate-900">
    <!-- Hamburger -->
    <button id="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')"
      class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-slate-800 rounded-lg">
      <i data-lucide="menu" class="w-5 h-5 text-white"></i>
    </button>

    <div class="p-6 max-w-5xl mx-auto">
      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold text-white flex items-center gap-2">
            <i data-lucide="bell" class="w-6 h-6 text-emerald-400"></i>
            Alerts &amp; Notifications
          </h1>
          <p class="text-slate-400 text-sm mt-1">Monitor sensor threshold breaches and system events</p>
        </div>
        <div class="flex items-center gap-3">
          <!-- Severity Filter -->
          <select id="severity-filter" onchange="filterAlerts(this.value)"
            class="bg-slate-800 border border-slate-600 text-slate-300 text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="all">All Severities</option>
            <option value="critical">Critical</option>
            <option value="warning">Warning</option>
            <option value="info">Info</option>
          </select>
          <button onclick="markAllRead()"
            class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all">
            <i data-lucide="check-check" class="w-4 h-4"></i>
            Mark All Read
          </button>
        </div>
      </div>

      <!-- Tab Bar -->
      <div class="flex gap-1 bg-slate-800 rounded-xl p-1 w-fit mb-6">
        <button id="tab-active" onclick="switchTab('active')"
          class="tab-btn px-5 py-2 rounded-lg text-sm font-medium transition-all bg-emerald-600 text-white">
          Active
        </button>
        <button id="tab-all" onclick="switchTab('all')"
          class="tab-btn px-5 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white">
          All Alerts
        </button>
      </div>

      <!-- Alert Count Badge -->
      <div class="flex items-center gap-3 mb-4">
        <span class="text-slate-400 text-sm">Showing <span id="alert-count" class="text-white font-semibold">0</span> alerts</span>
        <span id="unread-badge" class="hidden bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">0 unread</span>
      </div>

      <!-- Alert List -->
      <div id="alerts-list" class="space-y-3">
        <!-- Skeleton loading -->
        <div class="skeleton h-20"></div>
        <div class="skeleton h-20"></div>
        <div class="skeleton h-20"></div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-16">
        <i data-lucide="bell-off" class="w-12 h-12 text-slate-600 mx-auto mb-4"></i>
        <p class="text-slate-400 text-lg font-medium">No alerts found</p>
        <p class="text-slate-500 text-sm mt-1">All systems are operating within normal parameters</p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.WEATHER_API_BASE || 'http://localhost:8000';
    if (!localStorage.getItem('weather_token')) window.location.href = '../login.html';
    function authHeaders() { return { 'Authorization': 'Bearer ' + localStorage.getItem('weather_token') }; }
    function logout() { localStorage.clear(); window.location.href = '../login.html'; }

    let allAlerts = [];
    let currentTab = 'active';
    let currentSeverity = 'all';

    function formatTime(ts) {
      if (!ts) return '—';
      const date = new Date(ts);
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 60) return `${diff} second${diff !== 1 ? 's' : ''} ago`;
      if (diff < 3600) { const m = Math.floor(diff / 60); return `${m} minute${m !== 1 ? 's' : ''} ago`; }
      if (diff < 86400) { const h = Math.floor(diff / 3600); return `${h} hour${h !== 1 ? 's' : ''} ago`; }
      if (diff < 604800) { const d = Math.floor(diff / 86400); return `${d} day${d !== 1 ? 's' : ''} ago`; }
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function getSeverityClasses(severity) {
      const s = (severity || '').toLowerCase();
      if (s === 'critical') return { border: 'border-red-500', badge: 'bg-red-500 text-white', dot: 'bg-red-500' };
      if (s === 'warning')  return { border: 'border-yellow-500', badge: 'bg-yellow-500 text-black', dot: 'bg-yellow-500' };
      return { border: 'border-blue-400', badge: 'bg-blue-400 text-white', dot: 'bg-blue-400' };
    }

    function renderAlerts(alerts) {
      const list = document.getElementById('alerts-list');
      const empty = document.getElementById('empty-state');
      document.getElementById('alert-count').textContent = alerts.length;

      const unread = alerts.filter(a => !a.is_read).length;
      const badge = document.getElementById('unread-badge');
      if (unread > 0) { badge.textContent = `${unread} unread`; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');

      if (alerts.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.innerHTML = alerts.map(alert => {
        const cls = getSeverityClasses(alert.severity);
        const readOpacity = alert.is_read ? 'opacity-60' : '';
        return `
          <div class="border-l-4 ${cls.border} bg-slate-800 rounded-lg p-4 flex items-start justify-between shadow-lg hover:bg-slate-750 transition-all ${readOpacity}" id="alert-${alert.id}">
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap gap-2 items-center mb-1">
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold ${cls.badge}">
                  ${(alert.severity || 'info').toUpperCase()}
                </span>
                <span class="text-slate-200 font-medium text-sm">${alert.alert_type || 'System Alert'}</span>
                ${alert.is_read ? '<span class="text-slate-500 text-xs">(read)</span>' : ''}
              </div>
              <p class="text-slate-400 text-sm mt-1 leading-relaxed">${alert.message || 'No message available'}</p>
              <p class="text-slate-500 text-xs mt-2 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                ${formatTime(alert.created_at)}
                ${alert.device_id ? ` &bull; Device #${alert.device_id}` : ''}
              </p>
            </div>
            <div class="ml-4 flex-shrink-0">
              ${!alert.is_read ? `<button onclick="markRead(${alert.id})" class="text-xs text-emerald-400 hover:text-emerald-300 hover:underline font-medium transition-colors">Mark Read</button>` : '<span class="text-xs text-slate-600">Read</span>'}
            </div>
          </div>`;
      }).join('');
      lucide.createIcons();
    }

    function filterAlerts(severity) {
      currentSeverity = severity;
      applyFilters();
    }

    function applyFilters() {
      let filtered = [...allAlerts];
      if (currentTab === 'active') filtered = filtered.filter(a => !a.is_read);
      if (currentSeverity !== 'all') filtered = filtered.filter(a => (a.severity || '').toLowerCase() === currentSeverity);
      renderAlerts(filtered);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-active').className = 'tab-btn px-5 py-2 rounded-lg text-sm font-medium transition-all ' +
        (tab === 'active' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white');
      document.getElementById('tab-all').className = 'tab-btn px-5 py-2 rounded-lg text-sm font-medium transition-all ' +
        (tab === 'all' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white');
      applyFilters();
    }

    async function fetchAlerts() {
      try {
        const res = await fetch(`${API_BASE}/api/alerts`, { headers: authHeaders() });
        if (!res.ok) throw new Error('Failed to fetch alerts');
        allAlerts = await res.json();
        applyFilters();
      } catch (err) {
        document.getElementById('alerts-list').innerHTML = `
          <div class="bg-red-900/20 border border-red-500/30 rounded-xl p-6 text-center">
            <i data-lucide="alert-triangle" class="w-8 h-8 text-red-400 mx-auto mb-2"></i>
            <p class="text-red-400 font-medium">Failed to load alerts</p>
            <p class="text-slate-500 text-sm mt-1">${err.message}</p>
            <button onclick="fetchAlerts()" class="mt-3 text-sm text-emerald-400 hover:underline">Retry</button>
          </div>`;
        lucide.createIcons();
      }
    }

    async function fetchActive() {
      try {
        const res = await fetch(`${API_BASE}/api/alerts/active`, { headers: authHeaders() });
        if (!res.ok) throw new Error('Failed to fetch active alerts');
        return await res.json();
      } catch { return []; }
    }

    async function markRead(id) {
      try {
        const btn = document.querySelector(`#alert-${id} button`);
        if (btn) { btn.textContent = 'Saving…'; btn.disabled = true; }
        const res = await fetch(`${API_BASE}/api/alerts/${id}/read`, {
          method: 'PATCH',
          headers: authHeaders()
        });
        if (!res.ok) throw new Error('Mark read failed');
        const idx = allAlerts.findIndex(a => a.id === id);
        if (idx !== -1) allAlerts[idx].is_read = true;
        applyFilters();
      } catch (err) {
        console.error('markRead error:', err);
      }
    }

    async function markAllRead() {
      const unread = allAlerts.filter(a => !a.is_read);
      for (const a of unread) await markRead(a.id);
    }

    // Initial load
    fetchAlerts();
    // Auto-refresh every 30s
    setInterval(fetchAlerts, 30000);
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
